name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck (severity=warning)
        run: shellcheck --severity=warning --shell=bash node-diagnostic.sh install.sh lib/common.sh lib/dns.sh modules/*.sh tests/smoke.sh tests/sshport-it.sh tests/guard-deps.sh tests/guard-netns.sh

  # компиляция eBPF-шейпера (nd-shaper.bpf.c) — чтобы правки BPF-программы
  # не ломались молча; сам attach проверяется только на живой ноде
  bpf-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang + libbpf
        run: sudo apt-get update && sudo apt-get install -y clang libbpf-dev linux-libc-dev gcc-multilib
      - name: compile modules/nd-shaper.bpf.c (-target bpf)
        run: |
          inc=""
          [ -d /usr/include/x86_64-linux-gnu ] && inc="-I/usr/include/x86_64-linux-gnu"
          clang -O2 -g -Wall -target bpf $inc -c modules/nd-shaper.bpf.c -o /tmp/nd-shaper.bpf.o
          test -s /tmp/nd-shaper.bpf.o
          readelf -S /tmp/nd-shaper.bpf.o | grep -q 'classifier/down'
          readelf -S /tmp/nd-shaper.bpf.o | grep -q 'classifier/up'
          echo "BPF compiled OK (classifier/down + classifier/up)"
      - name: compile modules/nd-guard-xdp.bpf.c (-target bpf)
        run: |
          inc=""
          [ -d /usr/include/x86_64-linux-gnu ] && inc="-I/usr/include/x86_64-linux-gnu"
          clang -O2 -g -Wall -target bpf $inc -c modules/nd-guard-xdp.bpf.c -o /tmp/nd-guard-xdp.bpf.o
          test -s /tmp/nd-guard-xdp.bpf.o
          readelf -S /tmp/nd-guard-xdp.bpf.o | grep -qE '\] xdp '
          echo "BPF compiled OK (xdp)"
      - name: compile modules/nd-guard-tc.bpf.c (-target bpf)
        run: |
          inc=""
          [ -d /usr/include/x86_64-linux-gnu ] && inc="-I/usr/include/x86_64-linux-gnu"
          clang -O2 -g -Wall -target bpf $inc -c modules/nd-guard-tc.bpf.c -o /tmp/nd-guard-tc.bpf.o
          test -s /tmp/nd-guard-tc.bpf.o
          readelf -S /tmp/nd-guard-tc.bpf.o | grep -qE '\] tc '
          echo "BPF compiled OK (tc)"
      - name: host-тест cookie
        run: |
          cc -O2 -Wall -Werror -I modules -o /tmp/gct tests/guard_cookie_test.c
          /tmp/gct

  # XDP guard на ядре runner'а: верификатор + bpftool prog run (гео, allowlist, SYN-ACK с cookie)
  guard-bpf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (clang, libbpf, статический bpftool)
        # sudo сбрасывает окружение — GH_TOKEN для gh release download пробрасывается явно
        run: sudo --preserve-env=GH_TOKEN bash tests/guard-deps.sh
      - name: XDP — тесты через bpftool prog run
        run: |
          echo "kernel: $(uname -r)"
          sudo python3 tests/guard_xdp_test.py -v

  # guard в netns-стенде (veth, XDP + tc): raw — объекты напрямую (generic XDP), cookie-рукопожатие
  # через bpf_sk_assign_tcp_reqsk без conntrack; guard — modules/guard.sh целиком (режим XDP на veth, гео,
  # NOTRACK, allowlist, certbot-хуки, reattach, соседство с шейпером).
  # ND_GUARD_REQUIRE_KFUNC=1 — ядро runner'а без kfunc = провал, а не тихий SKIP
  guard-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: deps (clang, libbpf, статический bpftool)
        run: sudo --preserve-env=GH_TOKEN bash tests/guard-deps.sh
      - name: netns-стенд, режим raw
        run: |
          echo "kernel: $(uname -r)"
          sudo ND_GUARD_REQUIRE_KFUNC=1 bash tests/guard-netns.sh raw
      - name: netns-стенд, режим guard (modules/guard.sh)
        run: sudo ND_GUARD_REQUIRE_KFUNC=1 bash tests/guard-netns.sh guard

  smoke-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y iproute2 procps nftables python3 gawk
      - name: smoke
        # sudo: nft -c требует netlink (CAP_NET_ADMIN) — без root проверка ruleset молча скипалась
        run: sudo bash tests/smoke.sh

  # ubuntu:22.04/24.04 в docker — там awk=mawk (на runner'е gawk): боевое окружение нод
  smoke-ubuntu-lts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ["22.04", "24.04"]
    steps:
      - uses: actions/checkout@v4
      - name: smoke in ubuntu:${{ matrix.tag }}
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/w" -w /w ubuntu:${{ matrix.tag }} bash -c '
            apt-get update -qq
            apt-get install -y -qq bash iproute2 procps nftables python3 grep sed coreutils >/dev/null
            bash tests/smoke.sh'

  smoke-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke in debian:12
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/w" -w /w debian:12 bash -c '
            apt-get update -qq
            apt-get install -y -qq bash iproute2 procps nftables python3 gawk grep sed coreutils >/dev/null
            bash tests/smoke.sh'

  smoke-alpine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: smoke in alpine:3.19 (busybox-окружение)
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/w" -w /w alpine:3.19 sh -c '
            apk add -q bash nftables python3 >/dev/null
            bash tests/smoke.sh'

  # ssh-port с настоящим sshd под systemd (PID 1): socket-activation (Ubuntu 24.04) и reload (Debian 12)
  sshport:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: ssh-port in ${{ matrix.image }}
        run: |
          docker run -d --name sp --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v "$PWD:/w" -w /w ${{ matrix.image }} bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq systemd systemd-sysv openssh-server iproute2 >/dev/null
              exec /sbin/init'
          for i in $(seq 1 90); do
            docker exec sp sh -c 'ss -Hltn "sport = :22" | grep -q .' 2>/dev/null && break
            sleep 2
          done
          docker exec sp systemctl is-active ssh.socket ssh.service || true
          docker exec -e ND_INTEGRATION=1 sp bash tests/sshport-it.sh

  # РЕАЛЬНОЕ применение optimize→verify→rollback→protect в privileged-контейнере —
  # то, что smoke (dry-run) не видит: значения в ядре, идемпотентность, чистоту отката
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:24.04", "debian:12"]
    steps:
      - uses: actions/checkout@v4
      - name: integration in ${{ matrix.image }}
        run: |
          docker run --rm --privileged -e ND_INTEGRATION=1 -v "$PWD:/w" -w /w ${{ matrix.image }} bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq bash iproute2 procps kmod nftables iptables ethtool systemd grep sed coreutils >/dev/null
            bash tests/integration.sh'
