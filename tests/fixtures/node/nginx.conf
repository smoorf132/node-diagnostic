# Managed by node-diagnostic (4.4.0): rr install node
server_names_hash_bucket_size 64;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
ssl_protocols       TLSv1.3;
ssl_session_timeout 1h;
ssl_session_cache   shared:SSL:10m;
ssl_session_tickets off;

server {
    server_name node.example.com;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    ssl_certificate "/etc/nginx/ssl/example.com/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/example.com/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/example.com/fullchain.pem";

    # Logging (proxy_protocol format includes real client IP)
    access_log /var/log/nginx/access.log proxy_protocol;
    error_log /var/log/nginx/error.log warn;

    root /var/www/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ручная правка: robots
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
